name: PocketHoops
options:
  bundleIdPrefix: com.jasonfang
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    # Jason's Apple Development team (the only signing identity on this Mac), so the app can be
    # run on his iPhone without re-picking the team after every `xcodegen generate`.
    DEVELOPMENT_TEAM: 6N239V8VV5

targets:
  PocketHoops:
    type: application
    platform: iOS
    sources: [PocketHoops]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jasonfang.pockethoops
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # World leaderboard (see README): your Supabase project's REST URL, like
        # https://<project-ref>.supabase.co/rest/v1, and its anon (or publishable) key. While either is
        # empty the board stays switched off.
        BOARD_URL: ""
        BOARD_KEY: ""
    info:
      path: PocketHoops/Info.plist
      properties:
        CFBundleDisplayName: Pocket Hoops
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        PHBoardURL: $(BOARD_URL)
        PHBoardKey: $(BOARD_KEY)
        # Plain http is allowed only to this Mac (a local test server for the leaderboard).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  PocketHoopsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PocketHoopsTests]
    dependencies:
      - target: PocketHoops
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PocketHoops.app/PocketHoops

schemes:
  PocketHoops:
    build:
      targets:
        PocketHoops: all
        PocketHoopsTests: [test]
    test:
      targets: [PocketHoopsTests]
